<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700" font-family="'Helvetica Neue',Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="980" height="700" fill="#14161c"/>

  <text x="40" y="52" fill="#f2f4f8" font-size="26" font-weight="700">URL 쿼리스트링: 파라미터 vs 아규먼트</text>
  <text x="40" y="80" fill="#8b93a7" font-size="15">"?" 뒤에 붙는 부분이 쿼리스트링이고, "&amp;"로 여러 항목을 이어 붙인다.</text>

  <!-- URL line -->
  <rect x="40" y="104" width="900" height="64" rx="10" fill="#1d2130" stroke="#2e3446"/>
  <rect x="421" y="118" width="376" height="36" rx="7" fill="#2a2140" stroke="#8b6cf0" stroke-dasharray="5 3"/>
  <text x="56" y="142" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#9aa3b8">https://search.naver.com/search.naver</text>
  <text x="433" y="142" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#f2f4f8">where=nexearch&amp;query=날씨&amp;enter=asda</text>
  <text x="418" y="142" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#ffd166" font-weight="700">?</text>
  <text x="797" y="190" fill="#8b6cf0" font-size="13" text-anchor="middle">↑ 쿼리스트링 (query string)</text>

  <!-- split arrows -->
  <path d="M609 200 L609 216 M160 240 L160 226 L609 226 M470 240 L470 226 M780 240 L780 226 L609 226" stroke="#3b4258" stroke-width="2" fill="none"/>
  <text x="640" y="222" fill="#ffd166" font-size="13">"&amp;" 기준으로 분리</text>

  <!-- 3 item boxes -->
  <g>
    <!-- item 1 -->
    <rect x="40" y="244" width="240" height="118" rx="10" fill="#1a1e2b" stroke="#2e3446"/>
    <rect x="56" y="266" width="100" height="40" rx="6" fill="#123042" stroke="#38bdf8"/>
    <text x="106" y="292" fill="#7dd3fc" font-size="17" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">where</text>
    <text x="164" y="293" fill="#ffd166" font-size="19" font-weight="700" text-anchor="middle">=</text>
    <rect x="176" y="266" width="88" height="40" rx="6" fill="#133325" stroke="#34d399"/>
    <text x="220" y="292" fill="#6ee7b7" font-size="16" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">nexearch</text>
    <text x="106" y="332" fill="#38bdf8" font-size="12" text-anchor="middle">파라미터</text>
    <text x="220" y="332" fill="#34d399" font-size="12" text-anchor="middle">아규먼트</text>
    <text x="160" y="352" fill="#6b7489" font-size="12" text-anchor="middle">검색 영역 지정</text>

    <!-- item 2 -->
    <rect x="300" y="244" width="240" height="118" rx="10" fill="#1a1e2b" stroke="#2e3446"/>
    <rect x="320" y="266" width="92" height="40" rx="6" fill="#123042" stroke="#38bdf8"/>
    <text x="366" y="292" fill="#7dd3fc" font-size="17" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">query</text>
    <text x="420" y="293" fill="#ffd166" font-size="19" font-weight="700" text-anchor="middle">=</text>
    <rect x="432" y="266" width="76" height="40" rx="6" fill="#133325" stroke="#34d399"/>
    <text x="470" y="293" fill="#6ee7b7" font-size="17" font-weight="700" text-anchor="middle">날씨</text>
    <text x="366" y="332" fill="#38bdf8" font-size="12" text-anchor="middle">파라미터</text>
    <text x="470" y="332" fill="#34d399" font-size="12" text-anchor="middle">아규먼트</text>
    <text x="420" y="352" fill="#6b7489" font-size="12" text-anchor="middle">검색어 값</text>

    <!-- item 3 -->
    <rect x="560" y="244" width="240" height="118" rx="10" fill="#1a1e2b" stroke="#2e3446"/>
    <rect x="584" y="266" width="86" height="40" rx="6" fill="#123042" stroke="#38bdf8"/>
    <text x="627" y="292" fill="#7dd3fc" font-size="17" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">enter</text>
    <text x="678" y="293" fill="#ffd166" font-size="19" font-weight="700" text-anchor="middle">=</text>
    <rect x="690" y="266" width="76" height="40" rx="6" fill="#133325" stroke="#34d399"/>
    <text x="728" y="292" fill="#6ee7b7" font-size="16" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">asda</text>
    <text x="627" y="332" fill="#38bdf8" font-size="12" text-anchor="middle">파라미터</text>
    <text x="728" y="332" fill="#34d399" font-size="12" text-anchor="middle">아규먼트</text>
    <text x="680" y="352" fill="#6b7489" font-size="12" text-anchor="middle">진입 경로 값</text>
  </g>

  <!-- zoom-in on one item -->
  <text x="40" y="408" fill="#8b93a7" font-size="14">한 항목을 확대해 보면</text>
  <rect x="40" y="422" width="420" height="92" rx="10" fill="#1d2130" stroke="#2e3446"/>
  <text x="70" y="470" font-size="26" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">
    <tspan fill="#7dd3fc">query</tspan><tspan fill="#ffd166">=</tspan><tspan fill="#6ee7b7">날씨</tspan>
  </text>
  <text x="70" y="498" fill="#38bdf8" font-size="13">이름(자리표)</text>
  <text x="146" y="498" fill="#ffd166" font-size="13">구분자</text>
  <text x="196" y="498" fill="#34d399" font-size="13">실제 값</text>
  <path d="M480 468 L504 468" stroke="#3b4258" stroke-width="2"/>
  <text x="516" y="458" fill="#c7cde0" font-size="15">이 항목 전체(이름=값)를</text>
  <text x="516" y="480" fill="#a78bfa" font-size="15" font-weight="700">"쿼리 파라미터"</text>
  <text x="640" y="480" fill="#c7cde0" font-size="15">라고 부른다</text>

  <!-- legend -->
  <rect x="40" y="536" width="900" height="134" rx="10" fill="#191d28" stroke="#2e3446"/>
  <text x="64" y="566" fill="#f2f4f8" font-size="15" font-weight="700">범례</text>

  <rect x="64" y="582" width="14" height="14" rx="3" fill="#123042" stroke="#38bdf8"/>
  <text x="88" y="594" fill="#7dd3fc" font-size="14" font-weight="700">파라미터 (Parameter)</text>
  <text x="252" y="594" fill="#c7cde0" font-size="14">값을 받을 이름(자리표). "=" 왼쪽.</text>

  <rect x="64" y="612" width="14" height="14" rx="3" fill="#133325" stroke="#34d399"/>
  <text x="88" y="624" fill="#6ee7b7" font-size="14" font-weight="700">아규먼트 / 인자 (Argument)</text>
  <text x="300" y="624" fill="#c7cde0" font-size="14">실제로 들어가는 값. "=" 오른쪽.</text>

  <rect x="64" y="642" width="14" height="14" rx="3" fill="#2a2140" stroke="#a78bfa"/>
  <text x="88" y="654" fill="#a78bfa" font-size="13">보충</text>
  <text x="130" y="654" fill="#8b93a7" font-size="13">항목 전체(이름=값)를 통틀어 "쿼리 파라미터"라고도 부르며, 이런 항목들이 "&amp;"로 이어진 전체가 쿼리스트링이다.</text>
</svg>
