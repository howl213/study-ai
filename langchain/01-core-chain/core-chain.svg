<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1030" width="1120" height="1030" font-family="'Helvetica Neue',Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="1120" height="1030" fill="#14161c"/>

  <!-- ===== header ===== -->
  <text x="40" y="50" fill="#f2f4f8" font-size="27" font-weight="700">LangChain 핵심 체인 = 프롬프트 + LLM + 파서</text>
  <text x="40" y="78" fill="#8b93a7" font-size="14">LangChain에서 체인을 만드는 최소 단위. 세 부품을 LCEL 파이프(|)로 이어 붙인다.</text>

  <rect x="40" y="94" width="1040" height="58" rx="10" fill="#1d2130" stroke="#2e3446"/>
  <text x="560" y="132" text-anchor="middle" font-size="26" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">
    <tspan fill="#7dd3fc">prompt</tspan><tspan fill="#ffd166">  |  </tspan><tspan fill="#c4b5fd">llm</tspan><tspan fill="#ffd166">  |  </tspan><tspan fill="#6ee7b7">parser</tspan>
  </text>

  <!-- ===== pipeline ===== -->
  <text x="40" y="184" fill="#8b93a7" font-size="14">① 세 부품의 역할</text>

  <!-- prompt -->
  <rect x="40" y="196" width="320" height="200" rx="12" fill="#1a1e2b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="62" y="228" fill="#7dd3fc" font-size="18" font-weight="700">1. Prompt (프롬프트)</text>
  <line x1="62" y1="240" x2="338" y2="240" stroke="#2e3446"/>
  <text x="62" y="264" fill="#8b93a7" font-size="12">역할</text>
  <text x="62" y="284" fill="#dde2ee" font-size="14">사용자 입력을 모델이 읽을</text>
  <text x="62" y="304" fill="#dde2ee" font-size="14">문장(템플릿)으로 채워 넣는다</text>
  <text x="62" y="332" fill="#8b93a7" font-size="12">입력 → 출력</text>
  <text x="62" y="352" fill="#f2f4f8" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace">dict → PromptValue</text>
  <text x="62" y="380" fill="#38bdf8" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace">ChatPromptTemplate</text>

  <!-- arrow -->
  <path d="M366 296 L394 296" stroke="#ffd166" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- llm -->
  <rect x="400" y="196" width="320" height="200" rx="12" fill="#1a1e2b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="422" y="228" fill="#c4b5fd" font-size="18" font-weight="700">2. LLM (모델)</text>
  <line x1="422" y1="240" x2="698" y2="240" stroke="#2e3446"/>
  <text x="422" y="264" fill="#8b93a7" font-size="12">역할</text>
  <text x="422" y="284" fill="#dde2ee" font-size="14">완성된 프롬프트를 받아</text>
  <text x="422" y="304" fill="#dde2ee" font-size="14">실제로 추론하고 답을 생성</text>
  <text x="422" y="332" fill="#8b93a7" font-size="12">입력 → 출력</text>
  <text x="422" y="352" fill="#f2f4f8" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace">PromptValue → AIMessage</text>
  <text x="422" y="380" fill="#a78bfa" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace">ChatOpenAI / ChatAnthropic</text>

  <path d="M726 296 L754 296" stroke="#ffd166" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- parser -->
  <rect x="760" y="196" width="320" height="200" rx="12" fill="#1a1e2b" stroke="#34d399" stroke-width="1.5"/>
  <text x="782" y="228" fill="#6ee7b7" font-size="18" font-weight="700">3. Parser (출력 파서)</text>
  <line x1="782" y1="240" x2="1058" y2="240" stroke="#2e3446"/>
  <text x="782" y="264" fill="#8b93a7" font-size="12">역할</text>
  <text x="782" y="284" fill="#dde2ee" font-size="14">모델 응답 객체를 내가 쓰기</text>
  <text x="782" y="304" fill="#dde2ee" font-size="14">좋은 타입으로 변환·정리</text>
  <text x="782" y="332" fill="#8b93a7" font-size="12">입력 → 출력</text>
  <text x="782" y="352" fill="#f2f4f8" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace">AIMessage → str / dict / 객체</text>
  <text x="782" y="380" fill="#34d399" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace">StrOutputParser 등</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffd166"/>
    </marker>
  </defs>

  <!-- ===== data flow ===== -->
  <text x="40" y="432" fill="#8b93a7" font-size="14">② 값이 실제로 어떻게 변하나 (같은 요청을 따라가 보기)</text>
  <rect x="40" y="444" width="1040" height="128" rx="10" fill="#191d28" stroke="#2e3446"/>

  <text x="62" y="474" fill="#6b7489" font-size="12">invoke 입력</text>
  <text x="62" y="496" font-size="14" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#dde2ee">{"word": "랭체인"}</text>
  <text x="300" y="474" fill="#38bdf8" font-size="12">Prompt 통과</text>
  <text x="300" y="496" font-size="14" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#7dd3fc">"랭체인을 한 문장으로 설명해줘"</text>

  <text x="62" y="536" fill="#a78bfa" font-size="12">LLM 통과</text>
  <text x="152" y="536" font-size="14" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#c4b5fd">AIMessage(content="랭체인은 LLM 앱을 ...")</text>
  <text x="62" y="560" fill="#34d399" font-size="12">Parser 통과</text>
  <text x="152" y="560" font-size="14" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#6ee7b7">"랭체인은 LLM 앱을 ..."  ← 순수 str</text>

  <!-- ===== code ===== -->
  <text x="40" y="608" fill="#8b93a7" font-size="14">③ 예시 코드 (LCEL)</text>
  <rect x="40" y="620" width="1040" height="214" rx="10" fill="#10131a" stroke="#2e3446"/>
  <g font-size="14.5" font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="62" y="650" fill="#6b7489">from langchain_core.prompts import ChatPromptTemplate</text>
    <text x="62" y="672" fill="#6b7489">from langchain_core.output_parsers import StrOutputParser</text>
    <text x="62" y="694" fill="#6b7489">from langchain_openai import ChatOpenAI</text>

    <text x="62" y="730" fill="#7dd3fc">prompt = ChatPromptTemplate.from_template("{word}을 한 문장으로 설명해줘")</text>
    <text x="62" y="752" fill="#c4b5fd">llm    = ChatOpenAI(model="gpt-4o-mini", temperature=0)</text>
    <text x="62" y="774" fill="#6ee7b7">parser = StrOutputParser()</text>

    <text x="62" y="806" font-weight="700">
      <tspan fill="#7dd3fc">chain</tspan><tspan fill="#dde2ee"> = </tspan><tspan fill="#7dd3fc">prompt</tspan><tspan fill="#ffd166"> | </tspan><tspan fill="#c4b5fd">llm</tspan><tspan fill="#ffd166"> | </tspan><tspan fill="#6ee7b7">parser</tspan>
    </text>
    <text x="62" y="826" fill="#dde2ee">chain.invoke({"word": "랭체인"})</text>
  </g>

  <!-- ===== exam points ===== -->
  <text x="40" y="870" fill="#ffd166" font-size="14" font-weight="700">④ 시험 포인트</text>
  <rect x="40" y="880" width="1040" height="104" rx="10" fill="#1f1b2e" stroke="#8b6cf0"/>
  <g font-size="13.5" fill="#dde2ee">
    <text x="62" y="906"><tspan fill="#ffd166" font-weight="700">1.</tspan> 체인의 최소 단위는 <tspan font-family="ui-monospace,Menlo,Consolas,monospace" fill="#f2f4f8">prompt | llm | parser</tspan> 세 개이고, <tspan font-family="ui-monospace,Menlo,Consolas,monospace" fill="#ffd166">|</tspan> 는 LCEL의 파이프 연산자다.</text>
    <text x="62" y="928"><tspan fill="#ffd166" font-weight="700">2.</tspan> 세 부품 모두 Runnable이라 <tspan font-family="ui-monospace,Menlo,Consolas,monospace" fill="#f2f4f8">invoke / stream / batch</tspan> 를 똑같은 방식으로 쓸 수 있다 (= 교체 가능).</text>
    <text x="62" y="950"><tspan fill="#ffd166" font-weight="700">3.</tspan> 파서를 바꾸면 체인의 출력 타입이 바뀐다: StrOutputParser → <tspan font-family="ui-monospace,Menlo,Consolas,monospace">str</tspan>, JsonOutputParser → <tspan font-family="ui-monospace,Menlo,Consolas,monospace">dict</tspan>, PydanticOutputParser → 객체.</text>
    <text x="62" y="972" fill="#a78bfa"><tspan font-weight="700">4.</tspan> 단, LangChain 전체 = 이 3개 + Retriever·VectorStore·Memory·Tools/Agent. 3개는 "핵심 체인"일 뿐이다.</text>
  </g>

  <text x="40" y="1012" fill="#4e566b" font-size="12">기억 문장: "프롬프트가 묻고, LLM이 답하고, 파서가 정리한다."</text>
</svg>
